---
name: test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./
        id: pr
      - run: echo "$PR"
        env:
          PR: ${{steps.pr.outputs.pull_request}}
      - run: echo "$SHA"
        env:
          SHA: ${{steps.pr.outputs.merge_commit_sha}}
