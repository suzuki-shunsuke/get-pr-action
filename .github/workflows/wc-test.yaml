---
name: test
on: workflow_call
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          persist-credentials: false
      - uses: ./
        id: pr
      - run: echo "$PR"
        env:
          PR: ${{steps.pr.outputs.pull_request}}
      - run: echo "$SHA"
        env:
          SHA: ${{steps.pr.outputs.merge_commit_sha}}
